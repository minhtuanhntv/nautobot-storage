name: Update Batfish Configs

on:
  push:
    branches:
      - user-guide  # Trigger khi push đến user-guide

jobs:
  update_configs:
    runs-on: [self-hosted, k8s-master-1]  # Chạy trên runner của bạn (dùng label)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Pull configs mới từ GitHub

      - name: Update Batfish volume
        run: |
          echo "Updating configs in Batfish volume" > /home/lancs/log.txt
          echo "Configs updated" >> /home/lancs/log.txt

      - name: Debug info
        if: always()
        run: |
          echo "Runner user: $(whoami)" >> /home/lancs/log.txt
          echo "Docker containers:" >> /home/lancs/log.txt
          docker ps >> /home/lancs/log.txt

      - name: Copy gns3-backup into Batfish container
        run: |
          echo "Copying gns3-backup folder into Batfish container..." >> /home/lancs/log.txt

          SRC_DIR="/home/lancs/actions-runner/_work/nautobot-storage/nautobot-storage/gns3-backup"
          DEST_DIR="/notebooks"
          CONTAINER_NAME="batfish"

          # Lấy container ID thật
          CONTAINER_ID=$(docker ps -q -f name="^${CONTAINER_NAME}$")

          if [ -n "${CONTAINER_ID}" ]; then
            echo "Container ${CONTAINER_NAME} (${CONTAINER_ID}) found, copying..." >> /home/lancs/log.txt

            docker exec "${CONTAINER_ID}" mkdir -p "${DEST_DIR}/backup-config/configs"
            docker exec "${CONTAINER_ID}" rm -r "${DEST_DIR}/backup-config/configs"
            docker cp "${SRC_DIR}/." "${CONTAINER_ID}:${DEST_DIR}/backup-config/configs/"

            echo "Listing copied files:" >> /home/lancs/log.txt
            docker exec "${CONTAINER_ID}" ls -l "${DEST_DIR}" >> /home/lancs/log.txt

            echo "Copy completed successfully." >> /home/lancs/log.txt
          else
            echo "Container ${CONTAINER_NAME} not found! Skipping copy." >> /home/lancs/log.txt
          fi
