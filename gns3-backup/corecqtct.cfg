!

!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service compress-config
!
hostname corecqtct
!
boot-start-marker
boot-end-marker
!
!
!
username admin privilege 15 secret 5 $1$39sS$zt6e2vtTgDP4rqreeKrUT.
no aaa new-model
!
!
!
!
!
!
!
!
ip domain-name lab.local
ip cef
no ipv6 cef
!
!
!
spanning-tree mode pvst
spanning-tree extend system-id
!
!
vlan access-map BLOCK 10
 match ip address BLOCK-14-13-ONEWAY
 action drop
vlan access-map BLOCK 20
 action forward
!
vlan filter BLOCK vlan-list 4
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface GigabitEthernet0/0
 negotiation auto
!
interface GigabitEthernet0/1
 switchport access vlan 3
 negotiation auto
!
interface GigabitEthernet0/2
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet0/3
 switchport access vlan 5
 negotiation auto
!
interface GigabitEthernet1/0
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet1/1
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet1/2
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet1/3
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet2/0
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet2/1
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet2/2
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet2/3
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet3/0
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet3/1
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet3/2
 switchport access vlan 4
 negotiation auto
!
interface GigabitEthernet3/3
 switchport access vlan 4
 negotiation auto
!
interface Vlan1
 ip address 10.10.10.2 255.255.255.0
!
interface Vlan3
 ip address 10.10.12.1 255.255.255.0
!
interface Vlan4
 ip address 10.10.14.1 255.255.255.0
 ip access-group BLOCK-14-13 in
!
interface Vlan5
 ip address 170.168.140.2 255.255.255.0
!
router ospf 1
 router-id 10.10.10.2
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.12.0 0.0.0.255 area 0
 network 10.10.14.0 0.0.0.255 area 0
 network 170.168.140.0 0.0.0.255 area 0
!
ip forward-protocol nd
!
ip http server
!
ip route 0.0.0.0 0.0.0.0 170.168.140.1
ip ssh time-out 60
ip ssh version 2
ip ssh server algorithm encryption aes128-ctr aes192-ctr aes256-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip access-list extended BLOCK-14-13
 deny   ip host 10.10.14.2 host 10.10.14.13
 permit ip any any
ip access-list extended BLOCK-14-13-ONEWAY
 permit ip host 10.10.14.2 host 10.10.14.13
!
!
!
!
snmp-server community public RW
snmp-server enable traps snmp authentication linkdown linkup coldstart warmstart
snmp-server host 192.168.100.200 version 2c public 
snmp-server host 192.168.100.92 version 2c public 
!
control-plane
!
banner exec ^C
